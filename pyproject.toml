[project]
name = "projeto-a4-api-multicamadas"
version = "0.1.0"
description = "API FastAPI em camadas com métricas Prometheus"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "loguru>=0.7,<1.0",
    "prometheus-client>=0.20,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = false
